name: build-hindsight-postgres

on:
  push:
    branches:
      - main
    paths:
      - "postgres/**"
      - ".github/workflows/build-postgres.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-hindsight-postgres
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/arkylin/hindsight-postgres
  PG_VERSION: "18.6"
  PGVECTOR_VERSION: "0.8.7"
  PGROONGA_VERSION: "4.1.0"
  IMAGE_TAG: "18.6-pgvector0.8.7-pgroonga4.1.0"

jobs:
  build:
    name: Build PostgreSQL image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./postgres
          file: ./postgres/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:18
            ${{ env.IMAGE }}:18.6
            ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}
            org.opencontainers.image.title=Hindsight PostgreSQL
            org.opencontainers.image.description=PostgreSQL ${{ env.PG_VERSION }} with pgvector ${{ env.PGVECTOR_VERSION }} and PGroonga ${{ env.PGROONGA_VERSION }}
          provenance: false
          cache-from: type=gha,scope=hindsight-postgres
          cache-to: type=gha,scope=hindsight-postgres,mode=max

      - name: Verify extensions in published image
        run: |
          set -euo pipefail
          docker pull "${IMAGE}:${IMAGE_TAG}"
          docker run --rm --entrypoint sh "${IMAGE}:${IMAGE_TAG}" -lc '
            psql --version
            test -f /usr/share/postgresql/18/extension/vector.control
            test -f /usr/share/postgresql/18/extension/pgroonga.control
            test -f /usr/share/postgresql/18/extension/btree_gin.control
            test -f /usr/share/postgresql/18/extension/pg_trgm.control
          '

      - name: Summary
        run: |
          {
            echo "### Hindsight PostgreSQL image"
            echo ""
            echo "- image: \`${IMAGE}\`"
            echo "- tag: \`${IMAGE_TAG}\`"
            echo "- base: \`groonga/pgroonga:4.1.0-debian-18\`"
            echo "- platforms: \`linux/amd64\`"
          } >> "$GITHUB_STEP_SUMMARY"
