name: build-hindsight

on:
  schedule:
    # Daily at 09:00 Asia/Shanghai (01:00 UTC)
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag (e.g. v1.3.0). Empty = newest stable semver tag."
        required: false
        default: ""
      force:
        description: "Rebuild even if both custom variant tags already exist."
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: build-hindsight
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/arkylin/hindsight
  UPSTREAM: vectorize-io/hindsight
  PACKAGE: hindsight

jobs:
  resolve-tag:
    name: Resolve upstream tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Resolve upstream tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-}"
          if [ -z "$TAG" ]; then
            TAG=$(gh api --paginate "repos/${UPSTREAM}/tags" --jq '.[].name' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V | tail -n1)
          else
            TAG="v${TAG#v}"
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Expected a stable vX.Y.Z upstream tag, got: ${TAG:-<empty>}"
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved upstream tag: $TAG (version $VERSION)"

  build:
    name: Build ${{ matrix.variant }}
    needs: resolve-tag
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            base_suffix: ""
            tag_suffix: ""
            cache_scope: full
          - variant: slim
            base_suffix: "-slim"
            tag_suffix: "-slim"
            cache_scope: slim
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check custom image
        id: image
        env:
          INPUT_FORCE: ${{ inputs.force }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
          VARIANT_SUFFIX: ${{ matrix.tag_suffix }}
          EXPECTED_VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          REF="${IMAGE}:${TAG}${VARIANT_SUFFIX}"
          if [ "${INPUT_FORCE}" = "true" ]; then
            echo "Force rebuild requested for ${REF}"
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! docker manifest inspect "$REF" >/dev/null 2>&1; then
            echo "Image does not exist yet: ${REF}"
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Legacy tags were slim-only and have no variant label. Rebuild those
          # once so Full becomes the canonical `latest` image.
          IMAGE_INFO=$(docker buildx imagetools inspect "$REF" \
            --format '{{json (index .Image "linux/amd64")}}' 2>/dev/null || true)
          if [ -z "$IMAGE_INFO" ] || [ "$IMAGE_INFO" = "null" ]; then
            IMAGE_INFO=$(docker buildx imagetools inspect "$REF" \
              --format '{{json .Image}}' 2>/dev/null || true)
          fi
          ACTUAL_VARIANT=$(printf '%s' "$IMAGE_INFO" \
            | jq -r '.config.Labels["io.github.arkylin.hindsight.variant"] // empty' \
            2>/dev/null || true)
          if [ "$ACTUAL_VARIANT" = "$EXPECTED_VARIANT" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image already exists: ${REF} (${EXPECTED_VARIANT})"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Rebuilding ${REF}: variant label is '${ACTUAL_VARIANT:-missing}', expected '${EXPECTED_VARIANT}'"
          fi

      - name: Check base image
        if: steps.image.outputs.exists == 'false'
        id: base
        env:
          VERSION: ${{ needs.resolve-tag.outputs.version }}
          BASE_SUFFIX: ${{ matrix.base_suffix }}
        run: |
          set -euo pipefail
          BASE="${REGISTRY}/${UPSTREAM}:${VERSION}${BASE_SUFFIX}"
          if ! docker manifest inspect "$BASE" >/dev/null 2>&1; then
            echo "::error::Base image not found: $BASE (release images may still be building; retry next run)"
            exit 1
          fi
          echo "image=$BASE" >> "$GITHUB_OUTPUT"
          echo "Base: $BASE"

      - name: Free disk space for full image
        if: steps.image.outputs.exists == 'false' && matrix.variant == 'full'
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout build repository
        if: steps.image.outputs.exists == 'false'
        uses: actions/checkout@v4

      - name: Checkout upstream
        if: steps.image.outputs.exists == 'false'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ needs.resolve-tag.outputs.tag }}
          path: upstream
          fetch-depth: 1

      - name: Set up QEMU
        if: steps.image.outputs.exists == 'false'
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        if: steps.image.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: steps.image.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            HINDSIGHT_IMAGE=${{ steps.base.outputs.image }}
          tags: |
            ${{ env.IMAGE }}:${{ needs.resolve-tag.outputs.tag }}${{ matrix.tag_suffix }}
            ${{ env.IMAGE }}:${{ needs.resolve-tag.outputs.version }}${{ matrix.tag_suffix }}
            ${{ env.IMAGE }}:latest${{ matrix.tag_suffix }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.resolve-tag.outputs.tag }}
            org.opencontainers.image.version=${{ needs.resolve-tag.outputs.version }}
            org.opencontainers.image.title=Hindsight custom ${{ matrix.variant }}
            io.github.arkylin.hindsight.variant=${{ matrix.variant }}
            io.github.arkylin.hindsight.base=${{ steps.base.outputs.image }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          cache-from: type=gha,scope=hindsight-${{ matrix.cache_scope }}
          cache-to: type=gha,scope=hindsight-${{ matrix.cache_scope }},mode=max

      - name: Summary
        if: always()
        env:
          VARIANT_SUFFIX: ${{ matrix.tag_suffix }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
          VERSION: ${{ needs.resolve-tag.outputs.version }}
          EXISTS: ${{ steps.image.outputs.exists }}
        run: |
          {
            echo "### Hindsight custom image (${{ matrix.variant }})"
            echo ""
            echo "- upstream tag: \`${TAG}\`"
            echo "- base image: \`${{ steps.base.outputs.image }}\`"
            echo "- build skipped: \`${EXISTS}\`"
            echo "- image: \`${IMAGE}\`"
            echo "- tags: \`${IMAGE}:latest${VARIANT_SUFFIX}\`, \`${IMAGE}:${TAG}${VARIANT_SUFFIX}\`, \`${IMAGE}:${VERSION}${VARIANT_SUFFIX}\`"
            echo "- platforms: \`linux/amd64\`, \`linux/arm64\`"
          } >> "$GITHUB_STEP_SUMMARY"

  prune:
    name: Prune GHCR versions
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Prune image versions (newest + 3 days)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE: ${{ env.PACKAGE }}
          KEEP_DAYS: "3"
        run: |
          set -euo pipefail
          API="/user/packages/container/${PACKAGE}/versions"
          gh api --paginate "$API" \
            --jq '.[] | [.id, .created_at, ((.metadata.container.tags // []) | join(","))] | @tsv' \
            > /tmp/versions.tsv
          echo "Versions (id, created_at, tags):"
          cat /tmp/versions.tsv
          NEWEST=$(sort -k2,2r /tmp/versions.tsv | head -n1 | cut -f1)
          # Always keep the newest version, even when it is older than KEEP_DAYS.
          CUTOFF=$(date -u -d "-${KEEP_DAYS} days" +%s)
          while IFS="$(printf '\t')" read -r id created tags; do
            [ -n "$id" ] || continue
            if [ "$id" = "$NEWEST" ] || echo ",$tags," | grep -Eq ',(latest|latest-slim),'; then
              echo "keep newest/latest-tagged: $id ($created) [$tags]"
              continue
            fi
            ts=$(date -u -d "$created" +%s)
            if [ "$ts" -lt "$CUTOFF" ]; then
              echo "delete: $id ($created) [$tags]"
              gh api --method DELETE "$API/$id"
            else
              echo "keep recent: $id ($created) [$tags]"
            fi
          done < /tmp/versions.tsv
